<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Farm Market | Account</title>
	<style>
		:root {
			--green: #176b45;
			--lime: #d7ef8f;
			--ink: #173b2c; 
			--cream: #fffdf5;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--cream);
			font-family: Georgia, 'Times New Roman', serif;
			background: #124c36 url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2000&q=85') center/cover fixed;
		}
		body::before {
			content: '';
			position: fixed;
			inset: 0;
			background: linear-gradient(120deg, rgba(8, 45, 31, .9), rgba(23, 107, 69, .68));
			z-index: -1;
		}
		main { width: min(1100px, 92%); margin: auto; padding: 42px 0 56px; }
		.brand { text-align: center; animation: rise .7s ease both; }
		.logo {
			width: 72px; height: 72px; margin: 0 auto 15px; display: grid; place-items: center;
			border: 2px solid var(--lime); border-radius: 24px 24px 24px 6px; color: var(--lime);
			font-size: 40px; transform: rotate(-5deg); background: rgba(255,255,255,.08);
		}
		h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 5.4rem); letter-spacing: 0; }
		.brand p { max-width: 550px; margin: 12px auto 0; color: #e8f5c6; font-size: 1.1rem; line-height: 1.5; }
		.choose { margin: 54px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
		.brand-title { display: flex; align-items: center; justify-content: center; gap: 14px; }
		.title-logo { width: 52px; height: 52px; margin: 0; font-size: 29px; border-radius: 17px 17px 17px 5px; }
		.role-card {
			padding: 34px; color: var(--ink); background: rgba(255,253,245,.96); border-radius: 22px;
			box-shadow: 0 24px 55px rgba(0,0,0,.2); animation: rise .7s .15s ease both; transition: transform .25s, box-shadow .25s;
		}
		.role-card:nth-child(2) { animation-delay: .25s; }
		.role-card:hover { transform: translateY(-8px); box-shadow: 0 32px 65px rgba(0,0,0,.3); }
		.role-icon { font-size: 2.8rem; }
		.eyebrow { margin: 16px 0 4px; color: var(--green); font: 700 .78rem Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
		h2 { margin: 0; font-size: 2rem; }
		.role-card p { min-height: 48px; color: #557064; line-height: 1.5; font-family: Arial, sans-serif; }
		.button {
			display: inline-block; width: 100%; padding: 14px 20px; border: 0; border-radius: 10px; color: #fff;
			background: var(--green); font: 700 1rem Arial, sans-serif; text-align: center; text-decoration: none; cursor: pointer; transition: background .2s, transform .2s;
		}
		.button:hover { background: #0d5032; transform: translateY(-2px); }
		.note { margin: 42px auto 0; max-width: 620px; color: #d7ebbd; font: .82rem Arial, sans-serif; line-height: 1.6; text-align: center; opacity: .9; }
		@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
		@media (min-width: 901px) { main { padding-top: 64px; } .choose { gap: 32px; } .role-card { padding: 40px; } }
		@media (max-width: 650px) {
			body { background-attachment: scroll; }
			main { width: min(100% - 22px, 520px); padding: 24px 0 32px; }
			.brand-title { gap: 8px; flex-wrap: wrap; }
			.logo { width: 52px; height: 52px; font-size: 28px; margin-bottom: 8px; }
			.title-logo { width: 40px; height: 40px; font-size: 22px; }
			h1 { font-size: 2.4rem; }
			.brand p { font-size: .9rem; line-height: 1.4; }
			.choose { grid-template-columns: 1fr; gap: 18px; margin-top: 28px; }
			.role-card { padding: 22px 18px; }
			.role-icon { font-size: 2.2rem; }
			.eyebrow { font-size: .7rem; letter-spacing: .1em; }
			h2 { font-size: 1.65rem; }
			.role-card p { min-height: auto; font-size: .92rem; margin-bottom: 16px; }
			.button { padding: 12px 16px; font-size: .96rem; }
			.note { margin-top: 24px; font-size: .76rem; }
		}
	</style>
</head>
<body>
	<main>
		<header class="brand">
			<div class="brand-title"><div class="logo title-logo" aria-hidden="true">🌱</div><h1 data-i18n="Farm Market">Farm Market</h1></div>
			<p data-i18n="Smart Market Linkage &amp; Price Discovery for Farmers">Smart Market Linkage &amp; Price Discovery for Farmers</p>
		</header>
		<section class="choose" aria-label="Choose login type">
			<article class="role-card">
				<div class="role-icon" aria-hidden="true">🌾</div>
				<div class="eyebrow" data-i18n="For farmers">For farmers</div>
				<h2 data-i18n="Seller Login">Seller Login</h2>
				<p data-i18n="Sell your crops at the right market and get better prices.">Sell your crops at the right market and get better prices.</p>
				<a class="button" href="seller.html" data-i18n="Login as Seller">Login as Seller</a>
			</article>
			<article class="role-card">
				<div class="role-icon" aria-hidden="true">🛒</div>
				<div class="eyebrow" data-i18n="For customers / buyers">For customers / buyers</div>
				<h2 data-i18n="Buyer Login">Buyer Login</h2>
				<p data-i18n="Find farmers and purchase fresh agricultural products.">Find farmers and purchase fresh agricultural products.</p>
				<a class="button" href="buyer.html" data-i18n="Login as Buyer">Login as Buyer</a>
			</article>
		</section>
		<p class="note" data-i18n="@Farm Market">@Farm Market</p>
	</main>
    <script src="../js/config.js"></script>
    <script src="../js/language.js"></script>
</body>
</html>
