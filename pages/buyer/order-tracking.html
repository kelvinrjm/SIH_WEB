<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order Logistics | FarmLink</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/buyer.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Buyer Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-link">
                    <div class="brand-logo-circle"><img src="../../img/logo.png" alt="FarmLink Logo"></div>
                    <div class="brand-title-wrap">
                        <h1 data-i18n="FarmLink">FarmLink</h1>
                        <span data-i18n="Buyer Portal">Buyer Portal</span>
                    </div>
                </a>
                <button type="button" class="sidebar-close" id="sidebarClose"><i data-lucide="x"></i></button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span data-i18n="Dashboard">Dashboard</span></a>
                <a href="marketplace.html" class="nav-item"><i data-lucide="store"></i><span data-i18n="Marketplace">Marketplace</span></a>
                <a href="search.html" class="nav-item"><i data-lucide="search"></i><span data-i18n="Search Produce">Search Produce</span></a>
                <a href="categories.html" class="nav-item"><i data-lucide="grid"></i><span data-i18n="Categories">Categories</span></a>
                <a href="cart.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    <span data-i18n="My Cart">My Cart</span>
                    <span class="badge cart-count-badge" style="display:none; margin-left:auto; background:var(--primary); color:#fff; font-size:0.75rem; padding:2px 7px; border-radius:10px;">0</span>
                </a>
                <a href="orders.html" class="nav-item active"><i data-lucide="package-check"></i><span data-i18n="My Orders">My Orders</span></a>
                <a href="chats.html" class="nav-item"><i data-lucide="message-square"></i><span data-i18n="Chats">Chats</span></a>
                <a href="favorites.html" class="nav-item"><i data-lucide="heart"></i><span data-i18n="Saved Produce">Saved Produce</span></a>
                <a href="notifications.html" class="nav-item"><i data-lucide="bell"></i><span data-i18n="Notifications">Notifications</span></a>
                <a href="profile.html" class="nav-item"><i data-lucide="user"></i><span data-i18n="Profile">Profile</span></a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span data-i18n="Settings">Settings</span></a>
                <a href="help.html" class="nav-item"><i data-lucide="help-circle"></i><span data-i18n="Help">Help</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar-small user-avatar-initials">PS</div>
                    <div class="user-info-small">
                        <div class="user-name user-name-display" data-i18n="Priya Sharma">Priya Sharma</div>
                        <div class="user-role user-role-display" data-i18n="Verified Buyer">Verified Buyer</div>
                    </div>
                </div>
                <a href="#" class="logout-btn"><i data-lucide="log-out"></i><span data-i18n="Logout">Logout</span></a>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button type="button" class="hamburger" id="hamburgerBtn"><i data-lucide="menu"></i></button>
                <div style="display:flex; align-items:center; gap:8px;">
                    <a href="orders.html" class="btn btn-icon" style="background:none; border:none;" title="Back to Orders">
                        <i data-lucide="arrow-left"></i>
                    </a>
                    <span style="font-weight:700; font-size:1.1rem;" data-i18n="Live Order Tracking">Logistics Tracking</span>
                </div>
                <div class="topbar-right">
                    <div class="language-selector">
                        <i data-lucide="globe" style="width:16px;height:16px;"></i>
                        <select class="lang-select-input">
                            <option value="en">English</option>
                            <option value="ta">தமிழ்</option>
                            <option value="hi">हिन्दी</option>
                        </select>
                    </div>
                </div>
            </header>

            <div class="page-container" style="max-width:900px;" id="trackingContent">
                <div style="text-align:center; padding:60px;">
                    <div class="spinner"></div>
                    <p style="color:var(--text-secondary); margin-top:14px;" data-i18n="Loading order tracking details...">Loading order tracking details...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/language.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/orders.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            FarmAuth.requireRole('buyer');
            lucide.createIcons();

            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');

            if (!orderId) {
                renderError('No Order ID specified.');
                return;
            }

            async function refreshTracking() {
                const order = await OrderService.getById(orderId);
                if (!order) {
                    renderError(`Order #${orderId} was not found.`);
                    return;
                }
                renderTracking(order);
            }

            try {
                await refreshTracking();
                const refreshTimer = window.setInterval(() => refreshTracking().catch(console.error), 10000);
                window.addEventListener('beforeunload', () => window.clearInterval(refreshTimer));
                window.addEventListener('focus', () => refreshTracking().catch(console.error));
            } catch (err) {
                renderError(err.message);
            }
        });

        function renderTracking(order) {
            const container = document.getElementById('trackingContent');
            const currentIndex = OrderService.getStatusStepIndex(order.status);
            const steps = [
                { key: ORDER_STATUSES.PLACED, label: 'Order Placed', desc: 'Order received & transmitted to farmer' },
                { key: ORDER_STATUSES.CONFIRMED, label: 'Farmer Confirmed', desc: 'Harvest & batch lot reserved' },
                { key: ORDER_STATUSES.PREPARING, label: 'Packaging / Crating', desc: 'Grading, electronic weighing, and crate packing' },
                { key: ORDER_STATUSES.OUT_FOR_DELIVERY, label: 'Out For Delivery', desc: 'Loaded on carrier vehicle; in transit' },
                { key: ORDER_STATUSES.DELIVERED, label: 'Delivered & Settled', desc: 'Produce unloaded & verified' }
            ];

            container.innerHTML = `
                <!-- Order Header Card -->
                <div class="card" style="padding:24px; margin-bottom:24px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
                        <div>
                            <span class="badge badge-confirmed" style="margin-bottom:6px;" data-i18n="Farm Direct Route">Farm Direct Route</span>
                            <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-primary); margin:0;" data-i18n="Order #${order.id.substring(0, 12)}">Order #${order.id.substring(0, 12)}</h1>
                            <div style="font-size:0.88rem; color:var(--text-secondary); margin-top:4px;">
                                Placed on ${FarmUtils.formatDate(order.createdAt)} · Farmer: <strong data-i18n="${order.farmerName || 'Verified Maharashtra Farmer'}">${order.farmerName || 'Verified Maharashtra Farmer'}</strong>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <span class="status-badge badge-${FarmUtils.getStatusBadgeClass(order.status)}" style="font-size:0.95rem; padding:6px 14px;">${order.status}</span>
                            <div style="margin-top:6px;">
                                <a href="invoice.html?id=${order.id}" class="btn btn-secondary btn-sm"><i data-lucide="file-text"></i> Invoice</a>
                            </div>
                        </div>
                    </div>

                    <!-- Return / Refund Info -->
                    ${order.returnStatus ? `
                        <div style="background:#FFF3E0; border:1px solid #FFE0B2; border-radius:8px; padding:16px; margin: 20px 0; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div style="font-weight:700; color:#E65100; font-size:1.05rem;" data-i18n="Return Status: ${order.returnStatus}">Return Status: ${order.returnStatus}</div>
                                <div style="font-size:0.85rem; color:var(--text-secondary); margin-top:4px;" data-i18n="Reason: ${order.returnDetails?.reason || 'N/A'}">Reason: ${order.returnDetails?.reason || 'N/A'}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:700; color:${order.refundStatus === 'REFUNDED' ? 'var(--primary)' : 'var(--text-primary)'}; font-size:1.05rem;" data-i18n="Refund: ${order.refundStatus}">Refund: ${order.refundStatus}</div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- 5-Stage Timeline -->
                    <div style="margin:36px 0 20px 0;">
                        <div class="tracking-timeline">
                            ${steps.map((step, idx) => {
                                let stepClass = '';
                                if (currentIndex > idx) stepClass = 'completed';
                                else if (currentIndex === idx) stepClass = 'active';

                                return `
                                    <div class="timeline-step ${stepClass}">
                                        <div class="step-circle">
                                            ${currentIndex > idx ? '<i data-lucide="check" style="width:14px; height:14px;"></i>' : (idx + 1)}
                                        </div>
                                        <div class="step-label">${step.label}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>

                <!-- Logistics & Delivery Destination Grid -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
                    <!-- Carrier & Vehicle Info -->
                    <div class="card" style="padding:24px;">
                        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
                            <div style="width:38px; height:38px; border-radius:var(--radius-full); background:rgba(46,125,50,0.12); color:var(--primary); display:grid; place-items:center;">
                                <i data-lucide="truck" style="width:20px; height:20px;"></i>
                            </div>
                            <div>
                                <h3 style="font-size:1.05rem; font-weight:700; margin:0;" data-i18n="Transport & Logistics">Transport & Logistics</h3>
                                <div style="font-size:0.82rem; color:var(--text-secondary);" data-i18n="Agri Logistics Partner">Agri Logistics Partner</div>
                            </div>
                        </div>
                        <div style="background:var(--surface-sunken); padding:12px 14px; border-radius:var(--radius-md); font-size:0.9rem; margin-bottom:12px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                <span style="color:var(--text-secondary);" data-i18n="Vehicle:">Vehicle:</span>
                                <strong data-i18n="Mahindra Bolero Maxi (MH-15-EN-8214)">Mahindra Bolero Maxi (MH-15-EN-8214)</strong>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                <span style="color:var(--text-secondary);" data-i18n="Driver:">Driver:</span>
                                <strong>Sunil Shinde (+91 97654 32109)</strong>
                            </div>
                            <div style="display:flex; justify-content:space-between;">
                                <span style="color:var(--text-secondary);" data-i18n="Dispatch Mode:">Dispatch Mode:</span>
                                <strong data-i18n="Direct Farm-to-Godown">Direct Farm-to-Godown</strong>
                            </div>
                        </div>
                        <a href="tel:9765432109" class="btn btn-secondary btn-sm" style="width:100%; justify-content:center;">
                            <i data-lucide="phone"></i> Call Driver
                        </a>
                    </div>

                    <!-- Delivery Address & Settlement -->
                    <div class="card" style="padding:24px;">
                        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
                            <div style="width:38px; height:38px; border-radius:var(--radius-full); background:rgba(2,136,209,0.12); color:var(--info); display:grid; place-items:center;">
                                <i data-lucide="map-pin" style="width:20px; height:20px;"></i>
                            </div>
                            <div>
                                <h3 style="font-size:1.05rem; font-weight:700; margin:0;" data-i18n="Destination & Buyer">Destination & Buyer</h3>
                                <div style="font-size:0.82rem; color:var(--text-secondary);" data-i18n="${order.buyerName || 'Verified Buyer'}">${order.buyerName || 'Verified Buyer'}</div>
                            </div>
                        </div>
                        <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:12px; line-height:1.5;" data-i18n="${order.deliveryAddress || 'APMC Market Yard, Navi Mumbai'}">${order.deliveryAddress || 'APMC Market Yard, Navi Mumbai'}</p>
                        <div style="display:flex; justify-content:space-between; font-size:0.9rem; padding-top:12px; border-top:1px solid var(--border);">
                            <span style="color:var(--text-secondary);" data-i18n="Total Settlement:">Total Settlement:</span>
                            <strong style="color:var(--primary); font-size:1.1rem;" data-i18n="${FarmUtils.formatCurrency(order.totalAmount || 0)}">${FarmUtils.formatCurrency(order.totalAmount || 0)}</strong>
                        </div>
                    </div>
                </div>

                <!-- Produce Items List -->
                <div class="card" style="padding:24px;">
                    <h3 style="font-size:1.15rem; font-weight:700; margin-bottom:16px;" data-i18n="Produce Consignment Details">Produce Consignment Details</h3>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th data-i18n="Produce Item">Produce Item</th>
                                    <th data-i18n="Quantity">Quantity</th>
                                    <th data-i18n="Unit Price">Unit Price</th>
                                    <th data-i18n="Total Amount">Total Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${order.items?.map(i => `
                                    <tr>
                                        <td style="font-weight:700;">${i.name}</td>
                                        <td>${i.quantity} ${i.unit || 'kg'}</td>
                                        <td>${FarmUtils.formatCurrency(i.price)}</td>
                                        <td style="font-weight:700; color:var(--primary);">${FarmUtils.formatCurrency(i.price * i.quantity)}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="4">No items listed</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            lucide.createIcons();
        }

        function renderError(msg) {
            document.getElementById('trackingContent').innerHTML = `
                <div style="text-align:center; padding:60px; background:#fff; border-radius:var(--radius); border:1px solid var(--border);">
                    <i data-lucide="alert-circle" style="width:48px; height:48px; color:var(--danger); margin-bottom:14px;"></i>
                    <h3 style="font-size:1.2rem; font-weight:700;" data-i18n="Unable to Track Order">Unable to Track Order</h3>
                    <p style="color:var(--text-secondary); font-size:0.92rem; margin:8px auto 16px auto;">${msg}</p>
                    <a href="orders.html" class="btn btn-primary"><i data-lucide="arrow-left"></i> Return to My Orders</a>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
    <script src="../../js/chatbot.js"></script>
</body>
</html>
