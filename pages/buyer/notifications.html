<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Notifications | FarmLink</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/buyer.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Buyer Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-link">
                    <div class="brand-logo-circle"><img src="../../img/logo.png" alt="FarmLink Logo"></div>
                    <div class="brand-title-wrap">
                        <h1 data-i18n="FarmLink">FarmLink</h1>
                        <span data-i18n="Buyer Portal">Buyer Portal</span>
                    </div>
                </a>
                <button type="button" class="sidebar-close" id="sidebarClose"><i data-lucide="x"></i></button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span data-i18n="Dashboard">Dashboard</span></a>
                <a href="marketplace.html" class="nav-item"><i data-lucide="store"></i><span data-i18n="Marketplace">Marketplace</span></a>
                <a href="search.html" class="nav-item"><i data-lucide="search"></i><span data-i18n="Search Produce">Search Produce</span></a>
                <a href="categories.html" class="nav-item"><i data-lucide="grid"></i><span data-i18n="Categories">Categories</span></a>
                <a href="cart.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    <span data-i18n="My Cart">My Cart</span>
                    <span class="badge cart-count-badge" style="display:none; margin-left:auto; background:var(--primary); color:#fff; font-size:0.75rem; padding:2px 7px; border-radius:10px;">0</span>
                </a>
                <a href="orders.html" class="nav-item"><i data-lucide="package-check"></i><span data-i18n="My Orders">My Orders</span></a>
                <a href="chats.html" class="nav-item"><i data-lucide="message-square"></i><span data-i18n="Chats">Chats</span></a>
                <a href="favorites.html" class="nav-item"><i data-lucide="heart"></i><span data-i18n="Saved Produce">Saved Produce</span></a>
                <a href="notifications.html" class="nav-item active"><i data-lucide="bell"></i><span data-i18n="Notifications">Notifications</span></a>
                <a href="profile.html" class="nav-item"><i data-lucide="user"></i><span data-i18n="Profile">Profile</span></a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span data-i18n="Settings">Settings</span></a>
                <a href="help.html" class="nav-item"><i data-lucide="help-circle"></i><span data-i18n="Help">Help</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar-small user-avatar-initials">PS</div>
                    <div class="user-info-small">
                        <div class="user-name user-name-display" data-i18n="Priya Sharma">Priya Sharma</div>
                        <div class="user-role user-role-display" data-i18n="Verified Buyer">Verified Buyer</div>
                    </div>
                </div>
                <a href="#" class="logout-btn"><i data-lucide="log-out"></i><span data-i18n="Logout">Logout</span></a>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button type="button" class="hamburger" id="hamburgerBtn"><i data-lucide="menu"></i></button>
                <div style="font-weight:700; font-size:1.1rem;" data-i18n="Notifications">Procurement Alerts</div>
                <div class="topbar-right">
                    <div class="language-selector">
                        <i data-lucide="globe" style="width:16px;height:16px;"></i>
                        <select class="lang-select-input">
                            <option value="en">English</option>
                            <option value="ta">தமிழ்</option>
                            <option value="hi">हिन्दी</option>
                        </select>
                    </div>
                </div>
            </header>

            <div class="page-container" style="max-width:800px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                    <div>
                        <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-primary);" data-i18n="Notifications">Notifications</h1>
                        <p style="color:var(--text-secondary); font-size:0.92rem;" data-i18n="Real-time fulfillment updates, dispatch notifications, and price alerts.">Real-time fulfillment updates, dispatch notifications, and price alerts.</p>
                    </div>
                    <button class="btn btn-secondary btn-sm" id="clearNotifsBtn"><i data-lucide="check-check"></i> Mark All as Read</button>
                </div>

                <div id="notifsContainer" style="display:flex; flex-direction:column; gap:12px;">
                    <!-- Populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/language.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/cart.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            FarmAuth.requireRole('buyer');
            lucide.createIcons();
            CartService.updateBadge();

            const defaultBuyerNotifs = [
                {
                    id: 'bn-1',
                    title: 'Order Out for Delivery',
                    message: 'Your Nashik Red Onion consignment (100 kg) is out for delivery in vehicle MH-15-EN-8214.',
                    time: '1 hour ago',
                    type: 'delivery',
                    read: false
                },
                {
                    id: 'bn-2',
                    title: 'Farmer Confirmed Order',
                    message: 'Farmer Ramesh Patel has accepted and confirmed your procurement order #ORD-8219.',
                    time: '3 hours ago',
                    type: 'order',
                    read: false
                },
                {
                    id: 'bn-3',
                    title: 'Fresh Lot Arrival: Sharbati Wheat',
                    message: 'New Grade A Sharbati Wheat (500 kg) just published by Dindori Agri Cluster at ₹28/kg.',
                    time: 'Yesterday',
                    type: 'product',
                    read: true
                }
            ];

            let notifs = FarmStorage.get('buyer_notifications', defaultBuyerNotifs);
            renderNotifs();

            function renderNotifs() {
                const container = document.getElementById('notifsContainer');
                if (notifs.length === 0) {
                    container.innerHTML = `
                        <div class="card" style="padding:50px; text-align:center;">
                            <i data-lucide="bell-off" style="width:40px; height:40px; color:var(--text-muted); margin-bottom:12px;"></i>
                            <h3 style="font-size:1.1rem; font-weight:700;" data-i18n="No Notifications">No Notifications</h3>
                            <p style="color:var(--text-secondary); font-size:0.9rem;" data-i18n="You are all caught up on orders and market updates.">You are all caught up on orders and market updates.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = notifs.map(n => `
                    <div class="card" style="padding:18px 20px; display:flex; align-items:flex-start; gap:16px; border-left:4px solid ${n.read ? 'var(--border)' : 'var(--primary)'}; background:${n.read ? '#fff' : '#F7FAF8'};">
                        <div style="width:40px; height:40px; border-radius:var(--radius-full); background:${n.type === 'delivery' ? 'rgba(2, 136, 209, 0.12)' : 'rgba(46, 125, 50, 0.12)'}; color:${n.type === 'delivery' ? 'var(--info)' : 'var(--primary)'}; display:grid; place-items:center; flex-shrink:0;">
                            <i data-lucide="${n.type === 'delivery' ? 'truck' : (n.type === 'order' ? 'package-check' : 'sparkles')}" style="width:20px; height:20px;"></i>
                        </div>
                        <div style="flex:1;">
                            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
                                <h4 style="font-size:1rem; font-weight:700; margin:0; color:var(--text-primary);">${n.title}</h4>
                                <span style="font-size:0.8rem; color:var(--text-secondary);">${n.time}</span>
                            </div>
                            <p style="font-size:0.9rem; color:var(--text-secondary); margin:0; line-height:1.4;">${n.message}</p>
                        </div>
                    </div>
                `).join('');

                lucide.createIcons();
            }

            document.getElementById('clearNotifsBtn').addEventListener('click', () => {
                notifs = notifs.map(n => ({ ...n, read: true }));
                FarmStorage.set('buyer_notifications', notifs);
                FarmUtils.showToast('All notifications marked as read', 'info');
                renderNotifs();
            });
        });
    </script>
    <script src="../../js/chatbot.js"></script>
</body>
</html>
