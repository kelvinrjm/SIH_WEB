<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Profile | FarmLink</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/buyer.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Buyer Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-link">
                    <div class="brand-logo-circle"><img src="../../img/logo.png" alt="FarmLink Logo"></div>
                    <div class="brand-title-wrap">
                        <h1 data-i18n="FarmLink">FarmLink</h1>
                        <span data-i18n="Buyer Portal">Buyer Portal</span>
                    </div>
                </a>
                <button type="button" class="sidebar-close" id="sidebarClose"><i data-lucide="x"></i></button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span data-i18n="Dashboard">Dashboard</span></a>
                <a href="marketplace.html" class="nav-item"><i data-lucide="store"></i><span data-i18n="Marketplace">Marketplace</span></a>
                <a href="search.html" class="nav-item"><i data-lucide="search"></i><span data-i18n="Search Produce">Search Produce</span></a>
                <a href="categories.html" class="nav-item"><i data-lucide="grid"></i><span data-i18n="Categories">Categories</span></a>
                <a href="cart.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    <span data-i18n="My Cart">My Cart</span>
                    <span class="badge cart-count-badge" style="display:none; margin-left:auto; background:var(--primary); color:#fff; font-size:0.75rem; padding:2px 7px; border-radius:10px;">0</span>
                </a>
                <a href="orders.html" class="nav-item"><i data-lucide="package-check"></i><span data-i18n="My Orders">My Orders</span></a>
                <a href="chats.html" class="nav-item"><i data-lucide="message-square"></i><span data-i18n="Chats">Chats</span></a>
                <a href="favorites.html" class="nav-item"><i data-lucide="heart"></i><span data-i18n="Saved Produce">Saved Produce</span></a>
                <a href="notifications.html" class="nav-item"><i data-lucide="bell"></i><span data-i18n="Notifications">Notifications</span></a>
                <a href="profile.html" class="nav-item active"><i data-lucide="user"></i><span data-i18n="Profile">Profile</span></a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span data-i18n="Settings">Settings</span></a>
                <a href="help.html" class="nav-item"><i data-lucide="help-circle"></i><span data-i18n="Help">Help</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar-small user-avatar-initials">PS</div>
                    <div class="user-info-small">
                        <div class="user-name user-name-display" data-i18n="Priya Sharma">Priya Sharma</div>
                        <div class="user-role user-role-display" data-i18n="Verified Buyer">Verified Buyer</div>
                    </div>
                </div>
                <a href="#" class="logout-btn"><i data-lucide="log-out"></i><span data-i18n="Logout">Logout</span></a>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button type="button" class="hamburger" id="hamburgerBtn"><i data-lucide="menu"></i></button>
                <div style="font-weight:700; font-size:1.1rem;" data-i18n="Buyer Profile">Buyer Profile</div>
                <div class="topbar-right">
                    <div class="language-selector">
                        <i data-lucide="globe" style="width:16px;height:16px;"></i>
                        <select class="lang-select-input">
                            <option value="en">English</option>
                            <option value="ta">தமிழ்</option>
                            <option value="hi">हिन्दी</option>
                        </select>
                    </div>
                </div>
            </header>

            <div class="page-container" style="max-width:820px;">
                <div class="card" style="padding:32px; margin-bottom:24px;">
                    <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border);">
                        <div style="width:72px; height:72px; border-radius:var(--radius-full); background:var(--primary); color:#fff; display:grid; place-items:center; font-size:1.6rem; font-weight:800;">
                            PS
                        </div>
                        <div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-primary);" class="user-name-display" data-i18n="Priya Sharma">Priya Sharma</h1>
                                <span class="status-badge badge-confirmed" data-i18n="✓ Verified Wholesale Buyer">✓ Verified Wholesale Buyer</span>
                            </div>
                            <div style="color:var(--text-secondary); font-size:0.92rem; margin-top:2px;" data-i18n="APMC Registered Trader · Navi Mumbai Agro Hub">APMC Registered Trader · Navi Mumbai Agro Hub</div>
                        </div>
                    </div>

                    <form id="buyerProfileForm">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                            <div class="form-group">
                                <label data-i18n="Full Name / Business Title">Full Name / Business Title</label>
                                <input type="text" id="bProfName" class="form-control" value="Priya Sharma" required>
                            </div>
                            <div class="form-group">
                                <label data-i18n="Mobile Number">Mobile Number</label>
                                <input type="tel" id="bProfPhone" class="form-control" value="+91 98765 43210" required>
                            </div>
                            <div class="form-group">
                                <label data-i18n="Email Address">Email Address</label>
                                <input type="email" id="bProfEmail" class="form-control" value="priya.sharma@agriprocure.in" required>
                            </div>
                            <div class="form-group">
                                <label data-i18n="APMC Trader / GST License">APMC Trader / GST License</label>
                                <input type="text" id="bProfLicense" class="form-control" value="MH-APMC-TR-2024-889" required>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top:20px;">
                            <label data-i18n="Default Receiving Godown / APMC Gala">Default Receiving Godown / APMC Gala</label>
                            <input type="text" id="bProfAddress" class="form-control" value="Gala No. 42, Sector 19, APMC Grain & Onion Market, Vashi, Navi Mumbai, MH - 400703" required>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
                            <div class="form-group">
                                <label data-i18n="Preferred Source District">Preferred Source District</label>
                                <select id="bProfDistrict" class="form-control">
                                    <option value="Nashik" selected>Nashik (Onion, Tomato, Grapes)</option>
                                    <option value="Pune">Pune (Vegetables, Flowers)</option>
                                    <option value="Nagpur">Nagpur (Oranges, Soybean)</option>
                                    <option value="Kolhapur">Kolhapur (Sugarcane, Jaggery)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label data-i18n="Primary Buying Capacity">Primary Buying Capacity</label>
                                <select id="bProfCapacity" class="form-control">
                                    <option value="retail">Retail (10 - 100 kg)</option>
                                    <option value="wholesale" selected>Wholesale (100 kg - 5 Tonnes)</option>
                                    <option value="institutional">Institutional / Bulk (> 5 Tonnes)</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-top:28px; display:flex; justify-content:flex-end;">
                            <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Update Buyer Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/language.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/cart.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            FarmAuth.requireRole('buyer');
            lucide.createIcons();
            CartService.updateBadge();

            const user = FarmAuth.getCurrentUser();
            if (user && user.name) {
                document.getElementById('bProfName').value = user.name;
                document.querySelectorAll('.user-name-display').forEach(el => el.textContent = user.name);
            }
            if (user && user.phone) {
                document.getElementById('bProfPhone').value = user.phone;
            }

            document.getElementById('buyerProfileForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const updatedName = document.getElementById('bProfName').value;
                const updatedPhone = document.getElementById('bProfPhone').value;

                if (user) {
                    user.name = updatedName;
                    user.phone = updatedPhone;
                    FarmAuth.saveSession(user);
                }

                FarmUtils.showToast('Buyer profile updated successfully!', 'success');
                setTimeout(() => location.reload(), 600);
            });
        });
    </script>
    <script src="../../js/chatbot.js"></script>
</body>
</html>
