<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to FarmLink | Farmer Market Linkage</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-card" style="width:min(580px, 100%); text-align:center;">
        <!-- Language Selector -->
        <div class="auth-lang-bar">
            <div class="language-selector">
                <i data-lucide="globe" style="width:16px;height:16px;"></i>
                <select class="lang-select-input" aria-label="Language selector">
                    <option value="en">English</option>
                    <option value="ta">தமிழ்</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </div>
        </div>

        <div class="auth-logo-circle" style="margin:0 auto 16px;">
            <img src="../img/logo.png" alt="FarmLink Logo">
        </div>

        <h1 style="font-size:2rem; font-weight:800; color:var(--text-primary);" data-i18n="Welcome to FarmLink">Welcome to FarmLink</h1>
        <p style="color:var(--primary); font-weight:700; font-size:1.05rem; margin:6px 0 16px;" data-i18n="Smart Market Linkage">Smart Market Linkage</p>
        <p style="color:var(--text-secondary); line-height:1.6; margin-bottom:28px;" data-i18n="Direct link from farmers to buyers">
            Direct link connecting farmers and wholesale/retail buyers with authentic government mandi price discovery, AI produce quality verification, and shared logistics pooling.
        </p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
            <a href="role-selection.html" class="btn btn-primary btn-lg" style="flex:1;">
                <span data-i18n="Get Started">Get Started</span>
                <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
            </a>
            <a href="../index.html" class="btn btn-secondary btn-lg" style="flex:1;">
                <span data-i18n="Login">Login</span>
            </a>
        </div>

        <div style="border-top:1px solid var(--border); padding-top:18px; display:flex; justify-content:center; gap:20px; font-size:0.85rem; color:var(--text-secondary);">
            <a href="../public/about.html" data-i18n="About">About</a>
            <a href="../public/how-it-works.html" data-i18n="How It Works">How It Works</a>
            <a href="../public/browse-products.html" data-i18n="Browse Marketplace">Browse Marketplace</a>
            <a href="../public/faq.html" data-i18n="FAQ">FAQ</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
