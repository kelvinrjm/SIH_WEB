<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | FarmLink</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-link">
                    <div class="brand-logo-circle"><img src="../../img/logo.png" alt="FarmLink Logo"></div>
                    <div class="brand-title-wrap">
                        <h1 data-i18n="FarmLink">FarmLink</h1>
                        <span data-i18n="Farmer Portal">Farmer Portal</span>
                    </div>
                </a>
                <button type="button" class="sidebar-close" id="sidebarClose"><i data-lucide="x"></i></button>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span data-i18n="Dashboard">Dashboard</span></a>
                <a href="products.html" class="nav-item"><i data-lucide="package"></i><span data-i18n="My Products">My Products</span></a>
                <a href="add-product.html" class="nav-item"><i data-lucide="plus-circle"></i><span data-i18n="Add Product">Add Product</span></a>
                <a href="orders.html" class="nav-item"><i data-lucide="shopping-bag"></i><span data-i18n="Orders">Orders</span></a>
                <a href="chats.html" class="nav-item"><i data-lucide="message-square"></i><span data-i18n="Chats">Chats</span></a>
                <a href="buyer-requests.html" class="nav-item"><i data-lucide="handshake"></i><span data-i18n="Buyer Requests">Buyer Requests</span></a>
                <a href="market-price.html" class="nav-item"><i data-lucide="trending-up"></i><span data-i18n="Market Price">Market Price</span></a>
                <a href="notifications.html" class="nav-item active"><i data-lucide="bell"></i><span data-i18n="Notifications">Notifications</span></a>
                <a href="profile.html" class="nav-item"><i data-lucide="user"></i><span data-i18n="Profile">Profile</span></a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span data-i18n="Settings">Settings</span></a>
                <a href="help.html" class="nav-item"><i data-lucide="help-circle"></i><span data-i18n="Help">Help</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar-small user-avatar-initials">RP</div>
                    <div class="user-info-small">
                        <div class="user-name user-name-display" data-i18n="Ramesh Patel">Ramesh Patel</div>
                        <div class="user-role user-role-display" data-i18n="Farmer / Seller">Farmer / Seller</div>
                    </div>
                </div>
                <a href="#" class="logout-btn"><i data-lucide="log-out"></i><span data-i18n="Logout">Logout</span></a>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <button type="button" class="hamburger" id="hamburgerBtn"><i data-lucide="menu"></i></button>
                <div style="font-weight:700; font-size:1.1rem;" data-i18n="Notifications">Notifications</div>
                <div class="topbar-right">
                    <div class="language-selector">
                        <i data-lucide="globe" style="width:16px;height:16px;"></i>
                        <select class="lang-select-input">
                            <option value="en">English</option>
                            <option value="ta">தமிழ்</option>
                            <option value="hi">हिन्दी</option>
                        </select>
                    </div>
                </div>
            </header>

            <div class="page-container" style="max-width:760px;">
                <div class="page-header">
                    <div>
                        <h1 class="page-title" data-i18n="Farmer Alerts & Updates">Farmer Alerts &amp; Updates</h1>
                        <p class="page-subtitle" data-i18n="Real-time alerts regarding buyer orders, mandi price spikes, and low inventory.">Real-time alerts regarding buyer orders, mandi price spikes, and low inventory.</p>
                    </div>
                    <button type="button" class="btn btn-secondary btn-sm" id="markAllReadBtn" data-i18n="Mark all read">Mark all read</button>
                </div>

                <div id="notificationsList" style="display:flex; flex-direction:column; gap:12px;">
                    <!-- Rendered dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/language.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AuthService.requireRole('farmer');
            renderNotifications();

            document.getElementById('markAllReadBtn').addEventListener('click', () => {
                NotificationService.markAllRead();
                Utils.showToast(t('Mark all read'), 'success');
                renderNotifications();
            });
        });

        function renderNotifications() {
            const list = NotificationService.getAll();
            const container = document.getElementById('notificationsList');

            if (list.length === 0) {
                container.innerHTML = '<div class="card empty-state"><h3 data-i18n="No notifications">No notifications</h3><p data-i18n="You have caught up with all updates.">You have caught up with all updates.</p></div>';
                return;
            }

            container.innerHTML = list.map(n => `
                <div class="card" style="padding:18px; display:flex; gap:16px; align-items:flex-start; ${n.read ? 'opacity:0.75;' : 'border-left:5px solid var(--primary);'}">
                    <div style="width:40px; height:40px; border-radius:var(--radius-full); background:var(--primary-light); color:var(--primary); display:grid; place-items:center; flex-shrink:0;">
                        <i data-lucide="bell" style="width:20px;height:20px;"></i>
                    </div>
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <strong style="font-size:1.02rem; color:var(--text-primary);" data-i18n="${Utils.escapeHtml(n.title)}">${Utils.escapeHtml(n.title)}</strong>
                            <span style="font-size:0.78rem; color:var(--text-muted);" data-i18n="${Utils.escapeHtml(n.time)}">${Utils.escapeHtml(n.time)}</span>
                        </div>
                        <p style="font-size:0.9rem; color:var(--text-secondary); line-height:1.5;" data-i18n="${Utils.escapeHtml(n.message)}">${Utils.escapeHtml(n.message)}</p>
                    </div>
                </div>
            `).join('');

            if (window.lucide) window.lucide.createIcons();
        }
    </script>
    <script src="../../js/chatbot.js"></script>
</body>
</html>
