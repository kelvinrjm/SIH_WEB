<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Published | FarmLink</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background:var(--bg); min-height:100vh; display:grid; place-items:center; padding:24px;">

    <div class="card" style="width:min(520px, 100%); text-align:center; padding:44px 32px; box-shadow:var(--shadow-xl);">
        <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
            <div class="language-selector">
                <i data-lucide="globe" style="width:16px;height:16px;"></i>
                <select class="lang-select-input" aria-label="Language selector">
                    <option value="en">English</option>
                    <option value="ta">தமிழ்</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </div>
        </div>

        <div style="width:76px; height:76px; border-radius:var(--radius-full); background:var(--primary-light); color:var(--primary); display:grid; place-items:center; margin:0 auto 20px;">
            <i data-lucide="check-circle" style="width:44px;height:44px;"></i>
        </div>

        <h1 style="font-size:1.85rem; font-weight:800; color:var(--text-primary); margin-bottom:8px;" data-i18n="Listing Published!">Listing Published!</h1>
        <p style="color:var(--text-secondary); line-height:1.6; margin-bottom:24px;">
            Your produce is now live in the FarmLink marketplace with status <span class="status-badge badge-available" data-i18n="AVAILABLE">AVAILABLE</span> and visible to wholesale &amp; retail buyers.
        </p>

        <div class="card" style="background:var(--bg); margin-bottom:28px; text-align:left; padding:18px;">
            <div style="font-size:0.85rem; color:var(--text-muted); text-transform:uppercase; font-weight:700;" data-i18n="Produce Summary">Produce Summary</div>
            <div style="font-size:1.3rem; font-weight:800; color:var(--text-primary); margin:6px 0;" id="summaryCropName" data-i18n="Tomato">Tomato</div>
            <div style="display:flex; justify-content:space-between; font-size:0.95rem; color:var(--text-secondary);">
                <span>Stock: <strong id="summaryQuantity">500 kg</strong></span>
                <span>Price: <strong id="summaryPrice">₹25 / kg</strong></span>
            </div>
        </div>

        <div style="display:flex; gap:12px; flex-direction:column;">
            <a href="products.html" class="btn btn-primary btn-lg">
                <i data-lucide="package"></i>
                <span data-i18n="View in My Products">View in My Products</span>
            </a>
            <a href="dashboard.html" class="btn btn-secondary">
                <span data-i18n="Back to Dashboard">Back to Dashboard</span>
            </a>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/language.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();

            const params = new URLSearchParams(window.location.search);
            let name = params.get('name');
            let qty = params.get('qty');
            let unit = params.get('unit');
            let price = params.get('price');

            if (!name && params.get('id')) {
                try {
                    const products = JSON.parse(localStorage.getItem('farmlink_products') || '[]');
                    const prod = products.find(p => String(p.id) === String(params.get('id')));
                    if (prod) {
                        name = prod.name;
                        qty = prod.quantity;
                        unit = prod.unit;
                        price = prod.price;
                    }
                } catch (e) {}
            }

            document.getElementById('summaryCropName').textContent = name || 'Fresh Produce';
            document.getElementById('summaryQuantity').textContent = `${qty || 100} ${unit || 'kg'}`;
            document.getElementById('summaryPrice').textContent = `₹${price || 30} / ${unit || 'kg'}`;
        });
    </script>
    <script src="../../js/chatbot.js"></script>
</body>
</html>
